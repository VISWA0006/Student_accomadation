# ===================================================================
# Student Accommodation Management System - Application Configuration
# ===================================================================

server.port=8085
spring.application.name=accommodation-main

# -------------------------------------------------------------------
# PostgreSQL Database Connectivity (Assignment Requirement)
# Overridable via environment variables: DB_URL, DB_USERNAME, DB_PASSWORD
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/accommodation_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Viswa@123}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------------
# Hibernate / JPA Configuration
# ddl-auto=update automatically creates and updates tables for entities
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -------------------------------------------------------------------
# Thymeleaf Configuration
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# Microservice Inter-Service Communication
# URL of Accommodation Notification Microservice running on Port 8081
# -------------------------------------------------------------------
notification.service.url=http://localhost:8081/api/notifications/booking
