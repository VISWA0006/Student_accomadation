
server.port=${SERVER_PORT:8085}
spring.application.name=accommodation-main

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/accommodation_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Viswa@123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.security.admin.username=${ADMIN_USERNAME:}
app.security.admin.password=${ADMIN_PASSWORD:}
app.security.admin.password-hash=${ADMIN_PASSWORD_HASH:}

spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
