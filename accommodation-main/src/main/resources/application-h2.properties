# ===================================================================
# Fallback / In-Memory H2 Profile for quick tests or demo without PostgreSQL
# Activate by passing: --spring.profiles.active=h2
# ===================================================================

server.port=8080
spring.application.name=accommodation-main-h2

spring.datasource.url=jdbc:h2:mem:accommodation_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.password=${ADMIN_PASSWORD:DemoAdmin123!}
