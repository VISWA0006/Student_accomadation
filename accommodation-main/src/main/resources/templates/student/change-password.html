<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Change Password')}"></head>
<body>
<main class="content-area" style="max-width: 480px; margin: 10vh auto;">
    <section class="card">
        <div class="card-header"><h1 class="card-title">Change temporary password</h1></div>
        <div class="card-body">
            <div th:replace="~{fragments/layout :: alerts}"></div>
            <p>Choose a new password with at least 12 characters.</p>
            <form th:action="@{/student/change-password}" method="post">
                <div class="form-group">
                    <label for="currentPassword">Temporary password</label>
                    <input id="currentPassword" name="currentPassword" type="password" class="form-control"
                           autocomplete="current-password" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">New password</label>
                    <input id="newPassword" name="newPassword" type="password" class="form-control"
                           autocomplete="new-password" minlength="12" required>
                </div>
                <button type="submit" class="btn btn-primary">Update password</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
