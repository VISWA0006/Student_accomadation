<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in - Student Accommodation System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="content-area" style="max-width: 440px; margin: 10vh auto;">
    <section class="card">
        <div class="card-header"><h1 class="card-title">Sign in</h1></div>
        <div class="card-body">
            <div th:if="${param.error}" class="alert alert-danger">Invalid username or password.</div>
            <div th:if="${param.logout}" class="alert alert-success">You have been signed out.</div>
            <div th:if="${param.passwordChanged}" class="alert alert-success">Password updated. Sign in with your new password.</div>
            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" name="username" class="form-control" autocomplete="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" class="form-control"
                           autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary">Sign in</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
